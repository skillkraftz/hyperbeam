# GitHub accounts that count as "mine" in `hyperbeam scan`.
# Taken from the `Host github-*` aliases in ~/.ssh/config and the remotes under ~/projects.
accounts = ["skillkraftz", "trifactoria", "algoviewz"]
projects_dir = "~/projects"
# "switch": Open switches this terminal to the project (also over SSH). "window": a new kitty window per project at the laptop.
# The menu's Settings tab / Mode button changes it.
open_mode = "switch"
