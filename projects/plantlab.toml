# hyperbeam manifest for plantlab
# Next.js reads PORT from the session env and `next dev` binds 0.0.0.0, so it is reachable over Tailscale as is. ready_port defaults to the project port. The agent (agent:service) and cameras are left out on purpose.
path = "~/projects/plantlab"
port = 3101

[[service]]
name = "dev"
cmd = "pnpm dev"
ready_timeout = 60
