# hyperbeam's additions to tmux. ~/.config/tmux/tmux.conf sources this with one line:
#   source-file -q ~/.config/tmux/hyperbeam.conf
# (this file is symlinked there from the hyperbeam repo; `hyperbeam` also sources it into a running server when the menu starts).
# If you change a key here, change HINT in the `hyperbeam` script too: it shows the keys in the menu and the status bar.

# Mouse on. (Hold Shift to use kitty's own selection instead.)
set -g mouse on

# Pane selection and zoom, no prefix. (Checked: tmux.conf binds M-Arrow only in the prefix table, GNOME and kitty's defaults don't use plain Alt+Arrow or Alt+z.)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-z     resize-pane -Z

# Session stack, no prefix: the menu session `hyperbeam`, then project sessions in the order they were created.
bind -n M-] run-shell -b "~/.local/bin/hyperbeam _stack next #{client_name} #{session_name}"
bind -n M-[ run-shell -b "~/.local/bin/hyperbeam _stack prev #{client_name} #{session_name}"

# Copy the current pane's whole scrollback: to the clipboard at the laptop, to ~/.local/state/hyperbeam/outbox/ over SSH.
bind -n M-y run-shell -b "~/.local/bin/hyperbeam _copy-pane #{client_pid} #{client_name} #{pane_id} #{session_name}"

# Mouse drag-select copies to the tmux buffer and, at the laptop, to the Wayland clipboard (wl-copy).
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "~/.local/bin/hyperbeam _clip #{client_pid}"
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "~/.local/bin/hyperbeam _clip #{client_pid}"
